<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="50%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFDE00"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Squircle with Subtle Neon Rim -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#phoneBorder)" stroke-width="4"/>
  
  <!-- Perspective Cyber Grid -->
  <g opacity="0.15" stroke="#00F0FF" stroke-width="1.5">
    <line x1="80" y1="460" x2="256" y2="280"/>
    <line x1="160" y1="460" x2="256" y2="280"/>
    <line x1="256" y1="460" x2="256" y2="280"/>
    <line x1="352" y1="460" x2="256" y2="280"/>
    <line x1="432" y1="460" x2="256" y2="280"/>
    <ellipse cx="256" cy="400" rx="180" ry="40" fill="none"/>
    <ellipse cx="256" cy="350" rx="120" ry="25" fill="none"/>
  </g>

  <!-- 9:16 Vertical Reel Device Mockup Outline -->
  <rect x="146" y="70" width="220" height="372" rx="36" fill="rgba(10, 16, 28, 0.7)" stroke="url(#phoneBorder)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Device Speaker Pill -->
  <rect x="226" y="90" width="60" height="6" rx="3" fill="#334155"/>

  <!-- Reel Perforations Left -->
  <g fill="#00F0FF" opacity="0.6">
    <rect x="160" y="125" width="8" height="14" rx="2"/>
    <rect x="160" y="155" width="8" height="14" rx="2"/>
    <rect x="160" y="185" width="8" height="14" rx="2"/>
    <rect x="160" y="315" width="8" height="14" rx="2"/>
    <rect x="160" y="345" width="8" height="14" rx="2"/>
    <rect x="160" y="375" width="8" height="14" rx="2"/>
  </g>

  <!-- Reel Perforations Right -->
  <g fill="#FF007A" opacity="0.6">
    <rect x="344" y="125" width="8" height="14" rx="2"/>
    <rect x="344" y="155" width="8" height="14" rx="2"/>
    <rect x="344" y="185" width="8" height="14" rx="2"/>
    <rect x="344" y="315" width="8" height="14" rx="2"/>
    <rect x="344" y="345" width="8" height="14" rx="2"/>
    <rect x="344" y="375" width="8" height="14" rx="2"/>
  </g>

  <!-- Central Kinetic Neon Lightning Bolt & Play Core -->
  <g filter="url(#boltGlow)">
    <!-- Electric Gold Lightning Bolt -->
    <path d="M 285 110 L 195 250 L 260 250 L 225 400 L 325 240 L 260 240 Z" 
          fill="url(#goldGrad)" 
          stroke="#FFF" 
          stroke-width="2" 
          stroke-linejoin="round"/>
  </g>

  <!-- Pulsing Orbit Stars / Sparkles -->
  <path d="M 360 120 Q 360 135 375 135 Q 360 135 360 150 Q 360 135 345 135 Q 360 135 360 120 Z" fill="#00F0FF"/>
  <path d="M 140 370 Q 140 380 150 380 Q 140 380 140 390 Q 140 380 130 380 Q 140 380 140 370 Z" fill="#FFDE00"/>
  <circle cx="370" cy="360" r="4" fill="#FF007A"/>
  <circle cx="150" cy="130" r="3" fill="#00F0FF"/>
</svg>

